<svg viewBox="0 0 900 420" width="100%" style="display:block;max-width:820px;margin:0 auto" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <defs>
    <marker id="fbArr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#474650"/>
    </marker>
  </defs>

  <!-- Tail -->
  <line x1="90" y1="210" x2="60" y2="180" stroke="#474650" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="210" x2="60" y2="240" stroke="#474650" stroke-width="2" stroke-linecap="round"/>

  <!-- Spine -->
  <line x1="90" y1="210" x2="638" y2="210" stroke="#474650" stroke-width="2.5" marker-end="url(#fbArr)"/>

  <!-- Effect box (head) -->
  <rect x="652" y="184" width="220" height="52" rx="4" fill="#b71c1c"/>
  <text x="762" y="206" text-anchor="middle" font-size="11.5" font-weight="700" fill="white">Wrong IP dose</text>
  <text x="762" y="222" text-anchor="middle" font-size="11.5" font-weight="700" fill="white">administered</text>

  <!-- ===== PEOPLE (top-left) ===== -->
  <!-- Bone: (270,210) → (170,58) -->
  <line x1="270" y1="210" x2="170" y2="58" stroke="#2b9ce2" stroke-width="2"/>
  <rect x="123" y="30" width="94" height="26" rx="13" fill="#2b9ce2"/>
  <text x="170" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="white">People</text>
  <!-- Sub-cause 1: t=0.25 → (245, 172) -->
  <circle cx="245" cy="172" r="2.5" fill="#2b9ce2"/>
  <line x1="245" y1="172" x2="138" y2="172" stroke="#2b9ce2" stroke-width="1"/>
  <text x="135" y="165" text-anchor="end" font-size="9.5" fill="#474650">CRC-N new to study</text>
  <!-- Sub-cause 2: t=0.58 → (212, 122) -->
  <circle cx="212" cy="122" r="2.5" fill="#2b9ce2"/>
  <line x1="212" y1="122" x2="105" y2="122" stroke="#2b9ce2" stroke-width="1"/>
  <text x="102" y="115" text-anchor="end" font-size="9.5" fill="#474650">No verification step</text>

  <!-- ===== PROCESS (top-right) ===== -->
  <!-- Bone: (500,210) → (400,58) — staggered t values for clearance -->
  <line x1="500" y1="210" x2="400" y2="58" stroke="#9039f9" stroke-width="2"/>
  <rect x="353" y="30" width="94" height="26" rx="13" fill="#9039f9"/>
  <text x="400" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="white">Process</text>
  <!-- Sub-cause 1: t=0.35 → (465, 157) -->
  <circle cx="465" cy="157" r="2.5" fill="#9039f9"/>
  <line x1="465" y1="157" x2="365" y2="157" stroke="#9039f9" stroke-width="1"/>
  <text x="362" y="150" text-anchor="end" font-size="9.5" fill="#474650">Shared dosing log</text>
  <!-- Sub-cause 2: t=0.68 → (432, 107) -->
  <circle cx="432" cy="107" r="2.5" fill="#9039f9"/>
  <line x1="432" y1="107" x2="332" y2="107" stroke="#9039f9" stroke-width="1"/>
  <text x="329" y="100" text-anchor="end" font-size="9.5" fill="#474650">No worksheet template</text>

  <!-- ===== ENVIRONMENT (bottom-left) ===== -->
  <!-- Bone: (270,210) → (170,362) -->
  <line x1="270" y1="210" x2="170" y2="362" stroke="#00c4b4" stroke-width="2"/>
  <rect x="105" y="366" width="130" height="26" rx="13" fill="#00c4b4"/>
  <text x="170" y="383" text-anchor="middle" font-size="11" font-weight="700" fill="white">Environment</text>
  <!-- Sub-cause 1: t=0.25 → (245, 248) -->
  <circle cx="245" cy="248" r="2.5" fill="#00c4b4"/>
  <line x1="245" y1="248" x2="128" y2="248" stroke="#00c4b4" stroke-width="1"/>
  <text x="125" y="258" text-anchor="end" font-size="9.5" fill="#474650">Busy clinic day</text>
  <!-- Sub-cause 2: t=0.58 → (212, 298) -->
  <circle cx="212" cy="298" r="2.5" fill="#00c4b4"/>
  <line x1="212" y1="298" x2="95" y2="298" stroke="#00c4b4" stroke-width="1"/>
  <text x="92" y="308" text-anchor="end" font-size="9.5" fill="#474650">Shared dosing area</text>

  <!-- ===== EQUIPMENT / MATERIALS (bottom-right) ===== -->
  <!-- Bone: (500,210) → (400,362) — staggered -->
  <line x1="500" y1="210" x2="400" y2="362" stroke="#e8740c" stroke-width="2"/>
  <rect x="310" y="366" width="180" height="26" rx="13" fill="#e8740c"/>
  <text x="400" y="383" text-anchor="middle" font-size="11" font-weight="700" fill="white">Equipment / Materials</text>
  <!-- Sub-cause 1: t=0.35 → (465, 263) -->
  <circle cx="465" cy="263" r="2.5" fill="#e8740c"/>
  <line x1="465" y1="263" x2="345" y2="263" stroke="#e8740c" stroke-width="1"/>
  <text x="342" y="273" text-anchor="end" font-size="9.5" fill="#474650">Chart format unclear</text>
  <!-- Sub-cause 2: t=0.68 → (432, 313) -->
  <circle cx="432" cy="313" r="2.5" fill="#e8740c"/>
  <line x1="432" y1="313" x2="322" y2="313" stroke="#e8740c" stroke-width="1"/>
  <text x="319" y="323" text-anchor="end" font-size="9.5" fill="#474650">No row separators</text>
</svg>