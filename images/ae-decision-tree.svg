<svg viewBox="0 0 720 550" width="100%" style="display:block;max-width:660px;margin:0 auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aeArr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect fill="#ede3fe" height="44" stroke="#9039f9" stroke-width="1" width="300" x="250" y="14"/>
  <text dominant-baseline="central" fill="#6020c0" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="400" y="36">AE identified and assessed</text>
  <line marker-end="url(#aeArr)" stroke="#c8c5d1" stroke-width="1.5" x1="400" x2="400" y1="58" y2="88"/>
  <rect fill="#e5f3fb" height="58" stroke="#2b9ce2" stroke-width="1" width="400" x="200" y="88"/>
  <text dominant-baseline="central" fill="#1a6fa8" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="400" y="107">Does AE meet SAE criteria?</text>
  <text dominant-baseline="central" fill="#2b9ce2" font-family="Arial,sans-serif" font-size="10.5" text-anchor="middle" x="400" y="124">Death · life-threatening · hospitalization</text>
  <text dominant-baseline="central" fill="#2b9ce2" font-family="Arial,sans-serif" font-size="10.5" text-anchor="middle" x="400" y="138">disability · congenital anomaly</text>
  <path d="M200 117 L90 117 L90 198" fill="none" marker-end="url(#aeArr)" stroke="#787681" stroke-width="1.5"/>
  <text fill="#787681" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" x="143" y="110">No</text>
  <line marker-end="url(#aeArr)" stroke="#2b9ce2" stroke-width="1.5" x1="400" x2="400" y1="146" y2="178"/>
  <text fill="#2b9ce2" font-family="Arial,sans-serif" font-size="10" font-weight="700" x="408" y="165">Yes</text>
  <rect fill="#f4f3f0" height="44" stroke="#c8c5d1" stroke-width="1" width="140" x="20" y="198"/>
  <text dominant-baseline="central" fill="#474650" font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="90" y="216">Document and file</text>
  <rect fill="#e5f3fb" height="52" stroke="#2b9ce2" stroke-width="1" width="400" x="200" y="178"/>
  <text dominant-baseline="central" fill="#1a6fa8" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="400" y="197">SAE confirmed</text>
  <text dominant-baseline="central" fill="#2b9ce2" font-family="Arial,sans-serif" font-size="10.5" text-anchor="middle" x="400" y="216">Notify Sponsor within 24 hours</text>
  <line marker-end="url(#aeArr)" stroke="#c8c5d1" stroke-width="1.5" x1="400" x2="400" y1="230" y2="262"/>
  <rect fill="#e5f3fb" height="66" stroke="#2b9ce2" stroke-width="1" width="420" x="190" y="262"/>
  <text dominant-baseline="central" fill="#1a6fa8" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="400" y="282">Meets REB reporting criteria?</text>
  <text dominant-baseline="central" fill="#2b9ce2" font-family="Arial,sans-serif" font-size="10.5" text-anchor="middle" x="400" y="300">Unexpected · possibly related</text>
  <text dominant-baseline="central" fill="#2b9ce2" font-family="Arial,sans-serif" font-size="10.5" text-anchor="middle" x="400" y="317">suggests greater risk of harm than previously known</text>
  <path d="M190 295 L90 295 L90 376" fill="none" marker-end="url(#aeArr)" stroke="#787681" stroke-width="1.5"/>
  <text fill="#787681" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" x="138" y="288">No</text>
  <line marker-end="url(#aeArr)" stroke="#00c4b4" stroke-width="1.5" x1="400" x2="400" y1="328" y2="360"/>
  <text fill="#006a61" font-family="Arial,sans-serif" font-size="10" font-weight="700" x="408" y="347">Yes</text>
  <rect fill="#f4f3f0" height="52" stroke="#c8c5d1" stroke-width="1" width="140" x="20" y="376"/>
  <text dominant-baseline="central" fill="#474650" font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="90" y="394">No REB report</text>
  <text dominant-baseline="central" fill="#787681" font-family="Arial,sans-serif" font-size="10.5" text-anchor="middle" x="90" y="412">File in study files</text>
  <rect fill="#e5f5ee" height="52" stroke="#00c4b4" stroke-width="1" width="420" x="190" y="360"/>
  <text dominant-baseline="central" fill="#006a61" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="403" y="379">Report to REB via Nagano (F3H)</text>
  <text dominant-baseline="central" fill="#006a61" font-family="Arial,sans-serif" font-size="10.5" text-anchor="middle" x="403" y="397">Life-threatening: 7 days · Other: 15 days</text>
  <line marker-end="url(#aeArr)" stroke="#ffb400" stroke-width="1.5" x1="400" x2="400" y1="412" y2="444"/>
  <rect fill="#fff3cc" height="52" stroke="#ffb400" stroke-width="1" width="420" x="190" y="444"/>
  <text dominant-baseline="central" fill="#7a4f00" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" x="400" y="463">Sponsor-Investigator studies only</text>
  <text dominant-baseline="central" fill="#7a4f00" font-family="Arial,sans-serif" font-size="10.5" text-anchor="middle" x="400" y="481">CIOMS I report to Health Canada (7 or 15 days)</text>
  <text fill="#787681" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" x="400" y="516">External SUSARs: fourth criterion required — protocol/IB/ICF amendment or immediate participant notification before reporting to the REB.</text>
  <text fill="#c8c5d1" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" x="400" y="532">All categories: notify Sponsor as soon as possible · SAEs: within 24 hours</text>
</svg>
