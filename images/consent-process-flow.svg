<svg viewBox="0 0 480 540" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:560px;display:block;margin:0 auto" font-family="Arial,sans-serif">
  <text x="240" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#150e51" letter-spacing="1.5">INFORMED CONSENT — PROCESS FLOW</text>
  <rect x="30" y="28" width="400" height="68" fill="white" stroke="#150e51" stroke-width="1.5"/>
  <circle cx="54" cy="62" r="9" fill="#150e51"/><text x="54" y="66" text-anchor="middle" font-size="9" font-weight="700" fill="white">1</text>
  <text x="246" y="50" text-anchor="middle" font-size="9.5" font-weight="700" fill="#150e51" letter-spacing=".8">STEP 1 — CONFIRM ELIGIBILITY TO OBTAIN CONSENT</text>
  <text x="246" y="66" text-anchor="middle" font-size="9.5" fill="#474650">Person must be on the Task Delegation Log,</text>
  <text x="246" y="80" text-anchor="middle" font-size="9.5" fill="#474650">trained on SOP-CR-006, this SOP, and the protocol.</text>
  <line x1="240" y1="96" x2="240" y2="108" stroke="#2b9ce2" stroke-width="2"/>
  <polygon points="234,104 240,114 246,104" fill="#2b9ce2"/>
  <rect x="30" y="116" width="400" height="68" fill="white" stroke="#150e51" stroke-width="1.5"/>
  <circle cx="54" cy="150" r="9" fill="#150e51"/><text x="54" y="154" text-anchor="middle" font-size="9" font-weight="700" fill="white">2</text>
  <text x="246" y="138" text-anchor="middle" font-size="9.5" font-weight="700" fill="#150e51" letter-spacing=".8">STEP 2 — DETERMINE CONSENT REQUIREMENTS</text>
  <text x="246" y="154" text-anchor="middle" font-size="9.5" fill="#474650">LAR required? Translator? Impartial witness?</text>
  <text x="246" y="168" text-anchor="middle" font-size="9.5" fill="#474650">Confirm ICF is the latest REB-approved version.</text>
  <line x1="240" y1="184" x2="240" y2="196" stroke="#2b9ce2" stroke-width="2"/>
  <polygon points="234,192 240,202 246,192" fill="#2b9ce2"/>
  <rect x="30" y="204" width="400" height="78" fill="white" stroke="#150e51" stroke-width="1.5"/>
  <circle cx="54" cy="243" r="9" fill="#150e51"/><text x="54" y="247" text-anchor="middle" font-size="9" font-weight="700" fill="white">3</text>
  <text x="246" y="226" text-anchor="middle" font-size="9.5" font-weight="700" fill="#150e51" letter-spacing=".8">STEP 3 — REVIEW ICF WITH PARTICIPANT / LAR</text>
  <text x="246" y="242" text-anchor="middle" font-size="9.5" fill="#474650">Private setting, plain language. Assess understanding</text>
  <text x="246" y="256" text-anchor="middle" font-size="9.5" fill="#474650">by asking study-specific questions; document Q&amp;A.</text>
  <text x="246" y="270" text-anchor="middle" font-size="9.5" fill="#474650">Discuss risks including reproductive risks if applicable.</text>
  <line x1="240" y1="282" x2="240" y2="293" stroke="#2b9ce2" stroke-width="2"/>
  <polygon points="234,289 240,299 246,289" fill="#2b9ce2"/>
  <polygon points="240,296 336,332 240,368 144,332" fill="white" stroke="#787681" stroke-width="1.5"/>
  <text x="240" y="327" text-anchor="middle" font-size="9" fill="#150e51" font-weight="600">Participant / LAR</text>
  <text x="240" y="341" text-anchor="middle" font-size="9" fill="#150e51" font-weight="600">agrees to participate?</text>
  <line x1="336" y1="332" x2="394" y2="332" stroke="#787681" stroke-width="1.5"/>
  <polygon points="389,326 399,332 389,338" fill="#787681"/>
  <text x="365" y="324" text-anchor="middle" font-size="8.5" font-weight="700" fill="#787681">NO</text>
  <rect x="399" y="310" width="68" height="44" fill="white" stroke="#787681" stroke-width="1"/>
  <text x="433" y="328" text-anchor="middle" font-size="8.5" fill="#474650">Document</text>
  <text x="433" y="340" text-anchor="middle" font-size="8.5" fill="#474650">Screening</text>
  <text x="433" y="352" text-anchor="middle" font-size="8.5" fill="#474650">Log CR-009</text>
  <line x1="240" y1="368" x2="240" y2="380" stroke="#2b9ce2" stroke-width="2"/>
  <polygon points="234,376 240,386 246,376" fill="#2b9ce2"/>
  <text x="252" y="380" font-size="8.5" font-weight="700" fill="#2b9ce2">YES</text>
  <rect x="30" y="388" width="400" height="68" fill="white" stroke="#150e51" stroke-width="1.5"/>
  <circle cx="54" cy="422" r="9" fill="#150e51"/><text x="54" y="426" text-anchor="middle" font-size="9" font-weight="700" fill="white">4</text>
  <text x="246" y="410" text-anchor="middle" font-size="9.5" font-weight="700" fill="#150e51" letter-spacing=".8">STEP 4 — OBTAIN SIGNATURES</text>
  <text x="246" y="426" text-anchor="middle" font-size="9.5" fill="#474650">All required signatures obtained BEFORE any</text>
  <text x="246" y="440" text-anchor="middle" font-size="9.5" fill="#474650">screening procedure or study enrolment begins.</text>
  <line x1="240" y1="456" x2="240" y2="468" stroke="#2b9ce2" stroke-width="2"/>
  <polygon points="234,464 240,474 246,464" fill="#2b9ce2"/>
  <rect x="30" y="476" width="400" height="50" fill="white" stroke="#150e51" stroke-width="1.5"/>
  <circle cx="54" cy="501" r="9" fill="#150e51"/><text x="54" y="505" text-anchor="middle" font-size="9" font-weight="700" fill="white">5</text>
  <text x="246" y="496" text-anchor="middle" font-size="9.5" font-weight="700" fill="#150e51" letter-spacing=".8">STEP 5 — FILE, PROVIDE COPY &amp; NOTIFY</text>
  <text x="246" y="514" text-anchor="middle" font-size="9.5" fill="#474650">Original ICF to ISF · Copy to participant/LAR · Complete Appendix 3 checklist</text>
</svg>
